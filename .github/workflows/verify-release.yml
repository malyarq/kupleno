name: Verify changes

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and reproducible CI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Run complete verification
        run: npm run verify

      - name: Prove byte-for-byte reproducibility
        run: npm run verify:reproducible

      - name: Upload non-release CI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markettrat-ci-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context='MarketTrat verification'
          -f description='Tests and reproducibility passed'
