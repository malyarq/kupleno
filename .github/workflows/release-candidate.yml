name: Build release candidate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify immutable tag and build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Verify exact annotated tag and release contract
        shell: bash
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: npm run verify:release -- "$CANDIDATE_TAG"

      - name: Upload verified candidate without publishing it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markettrat-release-candidate-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
