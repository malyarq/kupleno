name: Build release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag, for example v0.15.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify immutable tag and build candidate
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install locked test tools
        run: npm ci

      - name: Install test Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact annotated tag and release contract
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run verify:release -- "$CANDIDATE_TAG"

      - name: Upload verified candidate without publishing it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: markettrat-release-candidate-${{ inputs.tag || github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
