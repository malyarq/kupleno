name: Предложить улучшение
description: Идея, которая сделает Куплено понятнее или полезнее
title: "[Идея]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Опишите не готовую кнопку, а ситуацию пользователя. Не прикладывайте чеки, ссылки на заказы, cookie, токены и резервные копии.
  - type: textarea
    id: problem
    attributes:
      label: Что сейчас неудобно
      description: Что вы хотели сделать и где остановились?
      placeholder: Я хотел увидеть ..., но сейчас приходится ...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Какой результат нужен
      description: По чему будет понятно, что проблема решена?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Как обходите сейчас
      description: Необязательно.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В тексте нет личных данных, чеков, ссылок на заказы, cookie, токенов и резервных копий.
          required: true
