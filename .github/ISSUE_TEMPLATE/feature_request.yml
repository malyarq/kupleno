name: Предложить улучшение
description: Понятная пользовательская проблема и желаемый результат
title: "[Идея]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что сейчас неудобно
      description: Опишите ситуацию и результат, которого не хватает. Не прикладывайте личные данные.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Какой результат нужен
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Как решаете это сейчас
      description: Необязательно.
  - type: checkboxes
    id: scope
    attributes:
      label: Границы
      options:
        - label: Предложение можно реализовать без передачи истории покупок разработчику.
          required: true
